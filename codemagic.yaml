# ─────────────────────────────────────────────────────────────
# Codemagic CI/CD — Club Manager (Vite + React + Capacitor)
#
# Pré-requisitos a configurar no Codemagic:
#   - Grupo de variáveis `teamapp` com as VITE_FIREBASE_* (build web).
#   - Grupo `google_play` com credenciais de publicação (Android).
#   - Grupo `appstore` + code signing (iOS).
# Os workflows abaixo cobrem o "build vazio nas duas lojas" do Sprint 0.
# ─────────────────────────────────────────────────────────────

definitions:
  scripts:
    - &install_deps
      name: Instalar dependências
      script: npm ci
    - &build_web
      name: Build web (Vite)
      script: npm run build
    - &cap_sync
      name: Capacitor sync
      script: npx cap sync

workflows:
  # ── Android ──────────────────────────────────────────────
  android-build:
    name: Android Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - teamapp
        - google_play
      node: 22
    scripts:
      - *install_deps
      - *build_web
      - name: Adicionar plataforma Android (se ausente)
        script: |
          [ -d android ] || npx cap add android
      - *cap_sync
      - name: Build do APK/AAB (debug — placeholder do Sprint 0)
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab

  # ── iOS — App Store (assinatura automática + TestFlight) ──
  # PRÉ-REQUISITOS (no painel do Codemagic, ver docs/APPLE_STORE.md):
  #   1. Integração App Store Connect — usando a chave "quantum_asc" já
  #      existente (Team settings > Integrations > Apple Developer Portal).
  #      Se preferir a outra ("CatMatch API Key"), troque o nome abaixo.
  #   2. Grupo de variáveis `teamapp` com as VITE_FIREBASE_*.
  #   3. assets/icon.png (1024x1024) commitado, para gerar o ícone.
  ios-appstore:
    name: iOS — App Store
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: quantum_asc
    environment:
      groups:
        - teamapp
      vars:
        BUNDLE_ID: 'app.clubmanager'
        APP_STORE_APPLE_ID: 6786035073
        XCODE_WORKSPACE: 'ios/App/App.xcworkspace'
        XCODE_SCHEME: 'App'
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - *install_deps
      - *build_web
      - name: Adicionar plataforma iOS (se ausente)
        script: |
          [ -d ios ] || npx cap add ios
      - name: Gerar ícones/splash
        script: |
          npx @capacitor/assets@latest generate --ios || echo "Sem assets/icon.png — usando ícone padrão."
      - name: Capacitor sync (instala os Pods)
        script: npx cap sync ios
      # Assinatura dividida em passos: assim, se algo falhar (ex.: a chave de API
      # nao tem permissao para criar certificado/perfil), o build PARA no comando
      # culpado com o erro real — em vez de seguir e quebrar so no build-ipa.
      - name: Inicializar keychain
        script: keychain initialize
      - name: Buscar/criar certificado + perfil (App Store Connect)
        script: |
          set -ex
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --create
      - name: Adicionar certificados ao keychain
        script: keychain add-certificates
      - name: Aplicar perfis ao projeto Xcode
        script: xcode-project use-profiles
      - name: Incrementar build number
        script: |
          set -e
          LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          cd ios/App
          agvtool new-version -all $((LATEST + 1))
      - name: Build do .ipa (release)
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # ── Web (deploy estático opcional via Firebase Hosting) ──
  web-build:
    name: Web Build
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      groups:
        - teamapp
      node: 22
    scripts:
      - *install_deps
      - name: Typecheck
        script: npm run typecheck
      - *build_web
    artifacts:
      - dist/**
