<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Ícones: favicon.svg é o fallback; os PNG/manifest são gerados a
         partir de assets/icon.png (ver assets/README.md). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#16a34a" />
    <meta
      name="description"
      content="Club Manager — gestão de times amadores: artilharia, assistências, aproveitamento e estatísticas do seu fut."
    />
    <title>Club Manager</title>
    <style>
      /* Splash instantâneo (antes do JS carregar). Removido em main.tsx. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(circle at 50% 35%, #16a34a 0%, #14532d 55%, #052e16 100%);
        color: #fff;
        font-family: Inter, system-ui, Avenir, Helvetica, Arial, sans-serif;
        transition: opacity 0.4s ease;
      }
      #splash.splash--hidden {
        opacity: 0;
        pointer-events: none;
      }
      #splash .splash-ball {
        font-size: 72px;
        animation: splash-bounce 1s ease-in-out infinite;
      }
      #splash .splash-name {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      #splash .splash-tag {
        font-size: 13px;
        opacity: 0.85;
        margin-top: -10px;
      }
      #splash .splash-spinner {
        width: 26px;
        height: 26px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top-color: #fff;
        border-radius: 50%;
        animation: splash-spin 0.8s linear infinite;
      }
      @keyframes splash-bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-14px); }
      }
      @keyframes splash-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .splash-ball, #splash .splash-spinner { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="splash-ball" aria-hidden="true">⚽</div>
      <div class="splash-name">Club Manager</div>
      <div class="splash-tag">artilharia · assistências · aproveitamento</div>
      <div class="splash-spinner" aria-hidden="true"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
